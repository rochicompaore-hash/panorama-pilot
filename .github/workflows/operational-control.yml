name: Operational control
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/enerhia-operational-control]
permissions:
  contents: read
concurrency:
  group: operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-operations-test.txt
      - run: pip install -r backend/requirements-operations-test.txt
      - run: PYTHONPATH=backend pytest backend/tests/test_operational_control.py -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts --non-interactive --network-timeout 60000
      - run: npx --yes yarn@1.22.22 build
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: https://example.invalid
          GENERATE_SOURCEMAP: 'false'
